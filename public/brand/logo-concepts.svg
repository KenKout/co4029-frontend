<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1120" viewBox="0 0 1180 1120" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Blue -> amber never interpolates directly: it routes through a light
         blue stop so the midpoint stays in-palette instead of going muddy grey. -->
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset=".45" stop-color="#3b82f6"/>
      <stop offset=".72" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="1120" fill="#f8fafc"/>
  <text x="40" y="44" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.6">aBridgeAI — LOGO, REVISION 2</text>
  <text x="40" y="65" font-size="12" fill="#94a3b8">#1e40af → #1d4ed8 · secondary #3b82f6 · accent #f59e0b · all spans convex-up (pixel-verified) · shared lockup grid</text>

  <!-- ═══════════ A · PIER ARCH (now actually contains an "a") ═══════════ -->
  <text x="40" y="112" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.2">A · PIER ARCH — deck + piers + suspenders. Counter under the arch reads as a lowercase "a".</text>

  <g transform="translate(40,132)">
    <rect width="286" height="196" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <g transform="translate(71,52)">
      <!-- arch (up) -->
      <path d="M10 74 Q72 6 134 74" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round"/>
      <!-- deck -->
      <rect x="0" y="72" width="144" height="12" rx="6" fill="url(#brand)"/>
      <!-- piers ground it as a BRIDGE, not a dome -->
      <rect x="18" y="84" width="11" height="26" rx="5.5" fill="#1e40af"/>
      <rect x="115" y="84" width="11" height="26" rx="5.5" fill="#1e40af"/>
      <!-- suspenders -->
      <g stroke="#93b4fc" stroke-width="5" stroke-linecap="round">
        <line x1="41" y1="72" x2="41" y2="44"/>
        <line x1="72" y1="72" x2="72" y2="32"/>
        <line x1="103" y1="72" x2="103" y2="44"/>
      </g>
      <circle cx="72" cy="28" r="9" fill="#f59e0b"/>
    </g>
    <text x="143" y="176" text-anchor="middle" font-size="11" fill="#94a3b8">mark</text>
  </g>

  <!-- shared lockup grid: mark box 88, gap 28, wordmark 36 -->
  <g transform="translate(346,132)">
    <rect width="434" height="196" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <g transform="translate(36,66)">
      <g transform="translate(0,4) scale(0.6)">
        <path d="M10 74 Q72 6 134 74" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round"/>
        <rect x="0" y="72" width="144" height="12" rx="6" fill="url(#brand)"/>
        <rect x="18" y="84" width="11" height="26" rx="5.5" fill="#1e40af"/>
        <rect x="115" y="84" width="11" height="26" rx="5.5" fill="#1e40af"/>
        <g stroke="#93b4fc" stroke-width="5" stroke-linecap="round">
          <line x1="41" y1="72" x2="41" y2="44"/><line x1="72" y1="72" x2="72" y2="32"/><line x1="103" y1="72" x2="103" y2="44"/>
        </g>
        <circle cx="72" cy="28" r="9" fill="#f59e0b"/>
      </g>
      <!-- wordmark: amber dot anchors the accent INTO the type -->
      <text x="116" y="34" font-size="36" font-weight="800" letter-spacing="-1.1" fill="#1e40af">aBridge<tspan fill="#3b82f6">AI</tspan></text>
      <circle cx="311" cy="24" r="4" fill="#f59e0b"/>
      <text x="117" y="54" font-size="10" fill="#64748b" letter-spacing="3.2">THE COGNITIVE CONDUIT</text>
    </g>
    <text x="217" y="176" text-anchor="middle" font-size="11" fill="#94a3b8">lockup · gap = cap height</text>
  </g>

  <g transform="translate(800,132)">
    <rect width="340" height="196" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(98,52)">
      <path d="M10 74 Q72 6 134 74" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
      <rect x="0" y="72" width="144" height="12" rx="6" fill="#60a5fa"/>
      <rect x="18" y="84" width="11" height="26" rx="5.5" fill="#3b82f6"/>
      <rect x="115" y="84" width="11" height="26" rx="5.5" fill="#3b82f6"/>
      <g stroke="#1d4ed8" stroke-width="5" stroke-linecap="round">
        <line x1="41" y1="72" x2="41" y2="44"/><line x1="72" y1="72" x2="72" y2="32"/><line x1="103" y1="72" x2="103" y2="44"/>
      </g>
      <circle cx="72" cy="28" r="9" fill="#f59e0b"/>
    </g>
    <text x="170" y="176" text-anchor="middle" font-size="11" fill="#475569">on dark · same amber #f59e0b</text>
  </g>

  <!-- ═══════════ B · CONDUIT SPAN ═══════════ -->
  <text x="40" y="378" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.2">B · CONDUIT SPAN — piers + deck added so it reads as a crossing, not a doorway. Gradient routed through light blue.</text>

  <g transform="translate(40,398)">
    <rect width="286" height="196" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <g transform="translate(64,58)">
      <!-- deck -->
      <rect x="0" y="62" width="158" height="11" rx="5.5" fill="#1e40af"/>
      <!-- piers -->
      <rect x="26" y="73" width="11" height="24" rx="5.5" fill="#1e40af"/>
      <rect x="121" y="73" width="11" height="24" rx="5.5" fill="#1e40af"/>
      <!-- cable arcs UP over the deck -->
      <path d="M6 62 Q79 -6 152 62" fill="none" stroke="url(#span)" stroke-width="10" stroke-linecap="round"/>
      <!-- travelling nodes: small -> large -> amber = direction of transfer -->
      <circle cx="79" cy="12" r="9" fill="#f59e0b"/>
    </g>
    <text x="143" y="176" text-anchor="middle" font-size="11" fill="#94a3b8">mark</text>
  </g>

  <g transform="translate(346,398)">
    <rect width="434" height="196" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <g transform="translate(36,70)">
      <g transform="translate(0,2) scale(0.56)">
        <rect x="0" y="62" width="158" height="11" rx="5.5" fill="#1e40af"/>
        <rect x="26" y="73" width="11" height="24" rx="5.5" fill="#1e40af"/>
        <rect x="121" y="73" width="11" height="24" rx="5.5" fill="#1e40af"/>
        <path d="M6 62 Q79 -6 152 62" fill="none" stroke="url(#span)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="79" cy="12" r="9" fill="#f59e0b"/>
      </g>
      <text x="116" y="30" font-size="36" font-weight="800" letter-spacing="-1.1" fill="#1e40af">aBridge<tspan fill="#3b82f6">AI</tspan></text>
      <circle cx="311" cy="20" r="4" fill="#f59e0b"/>
      <text x="117" y="50" font-size="10" fill="#64748b" letter-spacing="3.2">THE COGNITIVE CONDUIT</text>
    </g>
    <text x="217" y="176" text-anchor="middle" font-size="11" fill="#94a3b8">lockup · same grid as A</text>
  </g>

  <g transform="translate(800,398)">
    <rect width="340" height="196" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(91,58)">
      <rect x="0" y="62" width="158" height="11" rx="5.5" fill="#60a5fa"/>
      <rect x="26" y="73" width="11" height="24" rx="5.5" fill="#3b82f6"/>
      <rect x="121" y="73" width="11" height="24" rx="5.5" fill="#3b82f6"/>
      <path d="M6 62 Q79 -6 152 62" fill="none" stroke="url(#span)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="79" cy="12" r="9" fill="#f59e0b"/>
    </g>
    <text x="170" y="176" text-anchor="middle" font-size="11" fill="#475569">on dark</text>
  </g>

  <!-- ═══════════ C · aB TILE — curve now arcs UP ═══════════ -->
  <text x="40" y="644" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.2">C · "aB" TILE — amber span arches up over the letters. Matches the existing collapsed-sidebar "aB".</text>

  <g transform="translate(40,664)">
    <rect width="286" height="196" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <g transform="translate(87,42)">
      <rect width="112" height="112" rx="26" fill="url(#brand)"/>
      <text x="56" y="66" text-anchor="middle" font-size="48" font-weight="800" letter-spacing="-2" fill="#fff">aB</text>
      <!-- FIX: convex-up arch, mirroring concepts A and B -->
      <path d="M27 88 Q56 70 85 88" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="143" y="176" text-anchor="middle" font-size="11" fill="#94a3b8">app icon</text>
  </g>

  <g transform="translate(346,664)">
    <rect width="434" height="196" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <g transform="translate(36,62)">
      <!-- tile capped to the text-block height so it stops dominating -->
      <rect width="72" height="72" rx="17" fill="url(#brand)"/>
      <text x="36" y="43" text-anchor="middle" font-size="31" font-weight="800" letter-spacing="-1.3" fill="#fff">aB</text>
      <path d="M17 57 Q36 45 55 57" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
      <text x="116" y="34" font-size="36" font-weight="800" letter-spacing="-1.1" fill="#1e40af">aBridge<tspan fill="#3b82f6">AI</tspan></text>
      <circle cx="311" cy="24" r="4" fill="#f59e0b"/>
      <text x="117" y="54" font-size="10" fill="#64748b" letter-spacing="3.2">THE COGNITIVE CONDUIT</text>
    </g>
    <text x="217" y="176" text-anchor="middle" font-size="11" fill="#94a3b8">lockup · tile = text-block height</text>
  </g>

  <g transform="translate(800,664)">
    <rect width="340" height="196" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <g transform="translate(114,42)">
      <rect width="112" height="112" rx="26" fill="#1d4ed8"/>
      <text x="56" y="66" text-anchor="middle" font-size="48" font-weight="800" letter-spacing="-2" fill="#fff">aB</text>
      <path d="M27 88 Q56 70 85 88" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="170" y="176" text-anchor="middle" font-size="11" fill="#475569">on dark</text>
  </g>

  <!-- ═══════════ SCALE + MONO ═══════════ -->
  <text x="40" y="910" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.2">SCALE — 64 / 32 / 16 px, both marks, plus dedicated 16px variant and single-colour test</text>

  <g transform="translate(40,930)">
    <rect width="546" height="160" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="16" y="26" font-size="10" font-weight="700" fill="#64748b" letter-spacing=".8">TILE</text>
    <g transform="translate(20,38)">
      <rect width="64" height="64" rx="15" fill="url(#brand)"/>
      <text x="32" y="40" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="-1" fill="#fff">aB</text>
      <path d="M15 51 Q32 41 49 51" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
      <text x="32" y="82" text-anchor="middle" font-size="9" fill="#94a3b8">64</text>
    </g>
    <g transform="translate(100,54)">
      <rect width="32" height="32" rx="8" fill="url(#brand)"/>
      <text x="16" y="21" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="-.4" fill="#fff">aB</text>
      <text x="16" y="66" text-anchor="middle" font-size="9" fill="#94a3b8">32</text>
    </g>
    <!-- dedicated 16px: single letter, no curve -->
    <g transform="translate(200,62)">
      <rect width="16" height="16" rx="4" fill="#1e40af"/>
      <text x="8" y="13" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">a</text>
      <text x="8" y="58" text-anchor="middle" font-size="9" fill="#94a3b8">16 · "a"</text>
    </g>
    <text x="248" y="26" font-size="10" font-weight="700" fill="#64748b" letter-spacing=".8">ARCH</text>
    <g transform="translate(252,40)">
      <!-- 64: full detail -->
      <g transform="scale(0.44)">
        <path d="M10 74 Q72 6 134 74" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round"/>
        <rect x="0" y="72" width="144" height="12" rx="6" fill="url(#brand)"/>
        <rect x="18" y="84" width="11" height="26" rx="5.5" fill="#1e40af"/><rect x="115" y="84" width="11" height="26" rx="5.5" fill="#1e40af"/>
        <g stroke="#93b4fc" stroke-width="5" stroke-linecap="round"><line x1="41" y1="72" x2="41" y2="44"/><line x1="72" y1="72" x2="72" y2="32"/><line x1="103" y1="72" x2="103" y2="44"/></g>
        <circle cx="72" cy="28" r="9" fill="#f59e0b"/>
      </g>
      <text x="32" y="80" text-anchor="middle" font-size="9" fill="#94a3b8">64</text>
    </g>
    <g transform="translate(322,52)">
      <!-- 32: solid, thicker, no struts -->
      <g transform="scale(0.22)">
        <path d="M10 70 Q72 -2 134 70" fill="none" stroke="#1e40af" stroke-width="26" stroke-linecap="round"/>
        <rect x="0" y="68" width="144" height="20" rx="10" fill="#1e40af"/>
        <circle cx="72" cy="26" r="14" fill="#f59e0b"/>
      </g>
      <text x="16" y="68" text-anchor="middle" font-size="9" fill="#94a3b8">32 solid</text>
    </g>
    <!-- monochrome -->
    <text x="420" y="26" font-size="10" font-weight="700" fill="#64748b" letter-spacing=".8">1-COLOUR</text>
    <g transform="translate(428,44)">
      <g transform="scale(0.4)">
        <path d="M10 74 Q72 6 134 74" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
        <rect x="0" y="72" width="144" height="12" rx="6" fill="#0f172a"/>
        <rect x="18" y="84" width="11" height="26" rx="5.5" fill="#0f172a"/><rect x="115" y="84" width="11" height="26" rx="5.5" fill="#0f172a"/>
        <g stroke="#fff" stroke-width="5" stroke-linecap="round"><line x1="41" y1="72" x2="41" y2="44"/><line x1="72" y1="72" x2="72" y2="32"/><line x1="103" y1="72" x2="103" y2="44"/></g>
        <circle cx="72" cy="28" r="9" fill="#0f172a"/>
      </g>
      <text x="29" y="76" text-anchor="middle" font-size="9" fill="#94a3b8">solid black</text>
    </g>
    <g transform="translate(490,44)">
      <rect width="44" height="44" rx="11" fill="#0f172a"/>
      <text x="22" y="29" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="-.7" fill="#fff">aB</text>
      <text x="22" y="76" text-anchor="middle" font-size="9" fill="#94a3b8">mono tile</text>
    </g>
  </g>

  <!-- clearspace -->
  <g transform="translate(606,930)">
    <rect width="534" height="160" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="16" y="26" font-size="10" font-weight="700" fill="#64748b" letter-spacing=".8">CLEARSPACE = ½ MARK HEIGHT · MIN SIZES</text>
    <g transform="translate(34,54)">
      <rect x="-18" y="-18" width="180" height="96" fill="none" stroke="#cbd5e1" stroke-dasharray="4 4"/>
      <g transform="scale(0.42)">
        <path d="M10 74 Q72 6 134 74" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round"/>
        <rect x="0" y="72" width="144" height="12" rx="6" fill="url(#brand)"/>
        <rect x="18" y="84" width="11" height="26" rx="5.5" fill="#1e40af"/><rect x="115" y="84" width="11" height="26" rx="5.5" fill="#1e40af"/>
        <g stroke="#93b4fc" stroke-width="5" stroke-linecap="round"><line x1="41" y1="72" x2="41" y2="44"/><line x1="72" y1="72" x2="72" y2="32"/><line x1="103" y1="72" x2="103" y2="44"/></g>
        <circle cx="72" cy="28" r="9" fill="#f59e0b"/>
      </g>
    </g>
    <text x="16" y="148" font-size="10" fill="#64748b">min mark 24px · min lockup 120px · solid variant under 48px</text>
  </g>
</svg>
