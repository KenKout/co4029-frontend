<!-- aBridgeAI · mark for DARK surfaces.
     The brand blue #1e40af sits under 3:1 against #0f172a, so the arch and deck
     lose definition. This build lifts them to #60a5fa / #93b4fc and keeps the
     amber node, which already passes on navy. -->
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="110" viewBox="0 0 144 110" role="img" aria-label="aBridgeAI">
  <path d="M10 74 Q72 6 134 74" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
  <rect x="0" y="72" width="144" height="12" rx="6" fill="#60a5fa"/>
  <rect x="18" y="84" width="11" height="26" rx="5.5" fill="#3b82f6"/>
  <rect x="115" y="84" width="11" height="26" rx="5.5" fill="#3b82f6"/>
  <g stroke="#1d4ed8" stroke-width="5" stroke-linecap="round">
    <line x1="41" y1="72" x2="41" y2="44"/>
    <line x1="72" y1="72" x2="72" y2="32"/>
    <line x1="103" y1="72" x2="103" y2="44"/>
  </g>
  <circle cx="72" cy="28" r="9" fill="#f59e0b"/>
</svg>
