<!-- aBridgeAI · app icon / favicon tile. Matches the collapsed sidebar "aB".
     The amber stroke is a convex-up span (pixel-verified: midpoint sits ~27px
     above the endpoints at 336px render). Drop the span below 32px and use
     logo-favicon-16.svg at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="aBridgeAI">
  <defs>
    <linearGradient id="ab-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="112" height="112" rx="26" fill="url(#ab-tile)"/>
  <text x="56" y="66" text-anchor="middle" font-size="48" font-weight="800"
        letter-spacing="-2" fill="#fff"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif">aB</text>
  <path d="M27 88 Q56 70 85 88" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
</svg>
