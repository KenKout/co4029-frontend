<!-- aBridgeAI · compact lockup (no tagline).
     The tagline renders around 7px below 260px wide and aliases badly, so use
     this build for 140-260px. Below 140px use logo-mark.svg alone. -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="56" viewBox="0 0 300 56" role="img" aria-label="aBridgeAI">
  <defs>
    <linearGradient id="ab-cp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,2) scale(0.5)">
    <path d="M10 74 Q72 6 134 74" fill="none" stroke="url(#ab-cp)" stroke-width="17" stroke-linecap="round"/>
    <rect x="0" y="70" width="144" height="17" rx="8.5" fill="url(#ab-cp)"/>
    <rect x="18" y="86" width="15" height="26" rx="7.5" fill="#1e40af"/>
    <rect x="111" y="86" width="15" height="26" rx="7.5" fill="#1e40af"/>
    <circle cx="72" cy="28" r="12" fill="#f59e0b"/>
  </g>
  <text x="94" y="40" font-size="34" font-weight="800" letter-spacing="-1.1" fill="#1e40af"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif">aBridge<tspan fill="#3b82f6">AI</tspan></text>
  <circle cx="278" cy="31" r="4" fill="#f59e0b"/>
</svg>
